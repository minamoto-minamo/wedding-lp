<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Happy Wedding</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div class="ambient" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="card">
    <svg class="garland reveal" style="animation-delay:1.4s" viewBox="0 0 280 34" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="葉と小花のガーランド">
      <path d="M8,18 C45,4 75,30 112,16 C149,2 179,30 216,16 C240,7 258,14 272,10"
            fill="none" stroke="var(--leaf)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <g fill="var(--leaf)" opacity="0.85">
        <path d="M40,10 C34,6 30,10 34,15 C38,12 40,10 40,10 Z"/>
        <path d="M108,24 C102,20 98,24 102,29 C106,26 108,24 108,24 Z"/>
        <path d="M182,22 C176,18 172,22 176,27 C180,24 182,22 182,22 Z"/>
        <path d="M248,8 C242,4 238,8 242,13 C246,10 248,8 248,8 Z"/>
      </g>
      <g fill="var(--petal)">
        <circle cx="72" cy="17" r="3"/>
        <circle cx="146" cy="6" r="3"/>
        <circle cx="216" cy="16" r="3"/>
      </g>
      <g fill="var(--gold)">
        <circle cx="72" cy="17" r="1.1"/>
        <circle cx="146" cy="6" r="1.1"/>
        <circle cx="216" cy="16" r="1.1"/>
      </g>
    </svg>

    <div class="illust-wrap">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <svg class="illustration" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="向かい合う二羽の小鳥とハートのイラスト">
      <!-- soft filled bodies -->
      <path class="fill-shape" d="M18,78 C18,52 42,40 62,48 C70,51 74,44 80,38 C74,46 70,58 62,60 C46,64 26,66 18,78 Z" fill="var(--petal)" opacity="0.35"/>
      <path class="fill-shape" d="M182,78 C182,52 158,40 138,48 C130,51 126,44 120,38 C126,46 130,58 138,60 C154,64 174,66 182,78 Z" fill="var(--petal)" opacity="0.35"/>

      <g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="line-shape a" d="M18,78 C18,52 42,40 62,48 C70,51 74,44 80,38"/>
        <path class="line-shape a" d="M62,48 C58,58 46,60 36,55"/>
        <path class="line-shape a" d="M18,78 C24,86 40,90 52,82"/>
        <circle class="eye" cx="80" cy="38" r="1.6" fill="var(--accent)" stroke="none"/>

        <path class="line-shape b" d="M182,78 C182,52 158,40 138,48 C130,51 126,44 120,38"/>
        <path class="line-shape b" d="M138,48 C142,58 154,60 164,55"/>
        <path class="line-shape b" d="M182,78 C176,86 160,90 148,82"/>
        <circle class="eye" cx="120" cy="38" r="1.6" fill="var(--accent)" stroke="none"/>
      </g>
      <path class="heart-shape" d="M100,42 C96,34 85,36 85,46 C85,58 100,70 100,70 C100,70 115,58 115,46 C115,36 104,34 100,42 Z"
            fill="var(--gold)" stroke="none"/>
    </svg>
    </div>

    <h1 class="reveal" style="animation-delay:2.45s"><span class="nowrap">Happy</span> <span class="nowrap">Wedding</span></h1>
    <div class="divider reveal" style="animation-delay:2.6s"><span class="dot"></span></div>
    <p class="names reveal" id="names" style="animation-delay:2.52s"><span class="amp">&amp;</span></p>
    <p class="message reveal" style="animation-delay:2.72s">
      Congratulations!<br>
      Wishing you happiness<br>
      and love, always.
    </p>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="curtain" aria-hidden="true">
    <div class="curtain-panel left">
      <img src="assets/curtain-half.svg" alt="">
    </div>
    <div class="curtain-panel right">
      <img src="assets/curtain-half.svg" alt="">
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
