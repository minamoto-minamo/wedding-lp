<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Happy Wedding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
  :root{
    --bg-1:#ffe9d2;
    --bg-2:#f7c891;
    --bg-3:#e59a5f;
    --card-bg:rgba(255,251,244,0.94);
    --card-border:rgba(184,133,63,0.35);
    --ink:#6b3d24;
    --ink-soft:#9c6b45;
    --accent:#c9583f;
    --leaf:#a07a4a;
    --gold:#c9a24a;
    --petal:#e8836a;
    --dot:rgba(200,140,80,0.32);
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(2px 2px at 20% 25%, var(--dot) 40%, transparent 41%),
      radial-gradient(2px 2px at 70% 15%, var(--dot) 40%, transparent 41%),
      radial-gradient(2px 2px at 40% 60%, var(--dot) 40%, transparent 41%),
      radial-gradient(2px 2px at 85% 70%, var(--dot) 40%, transparent 41%),
      radial-gradient(2px 2px at 12% 80%, var(--dot) 40%, transparent 41%),
      radial-gradient(2px 2px at 60% 90%, var(--dot) 40%, transparent 41%),
      radial-gradient(140% 100% at 15% 0%, var(--bg-1), transparent 55%),
      radial-gradient(140% 100% at 88% 100%, var(--bg-3), transparent 55%),
      linear-gradient(165deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: var(--ink);
  }

  /* ---- 背景のゆっくりとした揺らぎ ---- */
  .ambient{
    position:fixed;
    inset:-12%;
    z-index:0;
    pointer-events:none;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.4), transparent 55%);
    mix-blend-mode: soft-light;
    opacity:0.7;
    animation: ambientDrift 46s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift{
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(6%, 7%) scale(1.08); }
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(10px, 3vw, 28px);
    overflow:hidden;
  }

  /* ---- 花びらが舞う演出 ---- */
  .petals{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .petal{
    position:absolute;
    top:-6%;
    width: 15px;
    height: 19px;
    opacity: 0;
    animation-name: drift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
    filter: drop-shadow(0 1px 1.5px rgba(107,61,36,0.12));
  }
  @keyframes drift{
    0%   { transform: translate(0,0) rotate(var(--startZ,0deg)) perspective(420px) rotateY(var(--startY,0deg)) scale(var(--scale,1)); opacity:0; }
    10%  { opacity: var(--peak, 0.8); }
    50%  { transform: translate(var(--mx,15px), 55vh) rotate(var(--startZ,0deg)) perspective(420px) rotateY(calc(var(--startY,0deg) + var(--my,180deg))) scale(var(--scale,1)); }
    88%  { opacity: var(--fade, 0.4); }
    100% { transform: translate(var(--ex,-15px), 112vh) rotate(var(--startZ,0deg)) perspective(420px) rotateY(calc(var(--startY,0deg) + var(--ey,380deg))) scale(var(--scale,1)); opacity:0; }
  }

  /* ---- 初回だけ:ガーデンドレープが開く演出 ---- */
  .curtain{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    pointer-events:none;
  }
  .curtain-panel{
    width:50%;
    height:100%;
    position:relative;
    background:
      repeating-linear-gradient(98deg,
        rgba(255,255,255,0) 0px,
        rgba(255,255,255,0.4) 7px,
        rgba(255,255,255,0) 15px,
        rgba(107,61,36,0.10) 24px,
        rgba(107,61,36,0.02) 30px,
        rgba(255,255,255,0) 34px),
      radial-gradient(120% 70% at 15% 0%, rgba(255,255,255,0.5), transparent 60%),
      linear-gradient(100deg, #fbe8cf, #f3cf9e 55%, #e3a86a 100%);
    animation: curtainOpenL 1.3s cubic-bezier(.62,0,.2,1) .45s both;
  }
  .curtain-panel.left{
    box-shadow: inset -34px 0 55px -30px rgba(107,61,36,0.32);
    clip-path: polygon(
      0% 5%, 18% 0%, 36% 5%, 54% 0.5%, 72% 5%, 90% 1%, 100% 4%,
      100% 68%, 86% 78%, 100% 88%,
      100% 100%, 0% 100%
    );
  }
  .curtain-panel.right{
    box-shadow: inset 34px 0 55px -30px rgba(107,61,36,0.32);
    clip-path: polygon(
      100% 5%, 82% 0%, 64% 5%, 46% 0.5%, 28% 5%, 10% 1%, 0% 4%,
      0% 68%, 14% 78%, 0% 88%,
      0% 100%, 100% 100%
    );
    animation-name: curtainOpenR;
  }
  .curtain-panel::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:3px;
    background: linear-gradient(180deg, #f6dd9c, #c9a24a 45%, #a97d34 55%, #f6dd9c);
    box-shadow: 0 0 4px rgba(201,162,74,0.5);
  }
  .curtain-panel.left::after{ right:0; }
  .curtain-panel.right::after{ left:0; }
  .curtain-panel .tie{
    position:absolute;
    bottom:14%;
    width:56px; height:56px;
  }
  .curtain-panel.left .tie{ right:-12px; }
  .curtain-panel.right .tie{ left:-12px; }
  @keyframes curtainOpenL{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }
  @keyframes curtainOpenR{ from{ transform:translateX(0); } to{ transform:translateX(100%); } }

  /* ---- 初回だけ:花びらのフラワーシャワー ---- */
  .confetti{ position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
  .confetti-piece{
    position:absolute;
    bottom:4%;
    width:9px; height:14px;
    border-radius: 70% 30% 70% 30%;
    opacity:0;
    animation: confettiPop 1.7s cubic-bezier(.15,.65,.25,1) forwards;
  }
  .confetti-piece.leaf{ border-radius: 0 70% 0 70%; }
  @keyframes confettiPop{
    0%   { transform: translate(0,0) rotate(0deg) scale(0.5); opacity:0; }
    10%  { opacity:1; }
    42%  { transform: translate(var(--mx), var(--my)) rotate(var(--mrot)) scale(1); opacity:1; }
    100% { transform: translate(var(--ex), var(--ey)) rotate(var(--erot)) scale(0.85); opacity:0; }
  }

  .card{
    position:relative;
    z-index:1;
    width:min(94vw, 460px);
    max-height:94dvh;
    overflow:hidden;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 6px;
    padding: clamp(30px, 9vw, 56px) clamp(24px, 8vw, 48px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    box-shadow:
      0 26px 64px rgba(155,90,50,0.22),
      0 2px 12px rgba(155,90,50,0.10),
      inset 0 0 0 5px rgba(255,255,255,0.55);
  }

  .reveal{
    opacity:0;
    animation: riseIn 0.75s ease both;
  }
  @keyframes riseIn{
    0%   { opacity:0; transform: translateY(12px); }
    100% { opacity:1; transform: translateY(0); }
  }

  .garland{
    width: 100%;
    max-width: 320px;
    height: auto;
    margin-bottom: clamp(8px, 2.4vw, 14px);
  }

  .illust-wrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: clamp(16px, 4.5vw, 26px);
  }
  .illust-wrap::before{
    content:"";
    position:absolute;
    width: 150%;
    height: 150%;
    background: radial-gradient(circle, var(--bg-3) 0%, transparent 68%);
    opacity: 0.8;
    z-index: 0;
  }
  .sparkles{ position:absolute; inset:-10%; z-index:2; pointer-events:none; }
  .sparkle{
    position:absolute;
    color: var(--gold);
    font-size: 11px;
    line-height:1;
    opacity:0;
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes twinkle{
    0%, 100% { opacity:0; transform: scale(0.5) rotate(0deg); }
    50%      { opacity:0.85; transform: scale(1.1) rotate(20deg); }
  }
  .illustration{
    position:relative;
    z-index:1;
    width: clamp(140px, 36vw, 190px);
    height:auto;
  }
  .illustration .fill-shape{
    opacity: 0;
    animation: fadeIn 0.6s ease 1.8s both;
  }
  .illustration .line-shape{
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: drawLine 0.9s ease 1.8s forwards;
  }
  .illustration .line-shape.b{ animation-delay: 1.92s; }
  .illustration .eye{
    opacity: 0;
    animation: fadeIn 0.3s ease 2.65s both;
  }
  .illustration .heart-shape{
    transform-origin: 100px 55px;
    opacity: 0;
    transform: scale(0.5);
    animation: tieKnot 0.6s cubic-bezier(.25,1.1,.4,1) 2.85s both,
               heartPulse 3.4s ease-in-out 3.45s infinite;
  }
  @keyframes heartPulse{
    0%, 100% { filter: drop-shadow(0 0 0 rgba(201,88,63,0)); }
    50%      { transform: scale(1.07); filter: drop-shadow(0 0 7px rgba(201,88,63,0.4)); }
  }
  @keyframes drawLine{ to { stroke-dashoffset: 0; } }
  @keyframes fadeIn{ to { opacity: 1; } }
  @keyframes tieKnot{
    0%   { opacity:0; transform: scale(0.5); }
    60%  { opacity:1; transform: scale(1.12); }
    100% { opacity:1; transform: scale(1); }
  }

  h1{
    font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(38px, 13vw, 66px);
    letter-spacing: 0.01em;
    line-height: 1.15;
    margin: 0;
    word-break: keep-all;
    overflow-wrap: normal;
    color: var(--ink);
  }
  h1 .nowrap{ white-space: nowrap; }

  .divider{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: clamp(18px,5vw,26px) 0;
  }
  .divider::before,
  .divider::after{
    content:"";
    width: 36px;
    height: 1.5px;
    background: var(--gold);
    opacity: 0.85;
  }
  .divider .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .names{
    font-family: "Cormorant Garamond", "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-style: italic;
    font-size: clamp(24px, 7vw, 32px);
    letter-spacing: 0.12em;
    color: var(--accent);
    margin: 0 0 clamp(16px,4.5vw,24px);
  }
  .names .amp{
    color: var(--gold);
    margin: 0 0.7em;
    font-size: 0.75em;
  }

  p.message{
    font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    font-weight: 500;
    font-size: clamp(17px, 4.6vw, 21px);
    line-height: 1.8;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0;
    max-width: 28ch;
  }

  /* ---- 極小画面(高さ600px未満)での余白・サイズ圧縮 ---- */
  @media (max-height: 600px){
    .card{
      padding: 16px 20px;
    }
    .garland{ margin-bottom: 6px; }
    .illust-wrap{ margin-bottom: 10px; }
    .divider{ margin: 10px 0; }
    .names{ margin-bottom: 10px; }
    .illustration{ width: clamp(110px, 30vw, 150px); }
    h1{ font-size: clamp(30px, 10vw, 48px); }
    p.message{ font-size: clamp(14px, 3.8vw, 17px); line-height: 1.65; }
  }

  @media (prefers-reduced-motion: reduce){
    .curtain{ display:none; }
    .confetti{ display:none; }
    .petal{ animation: none; display:none; }
    .ambient{ animation: none; display:none; }
    .sparkle{ animation: none; display:none; }
    .reveal{ animation: none; opacity:1; transform:none; }
    .illustration .fill-shape,
    .illustration .eye,
    .illustration .heart-shape{ animation: none; opacity:1; transform:none; }
    .illustration .line-shape{ animation: none; stroke-dashoffset:0; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="ambient" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="card">
    <svg class="garland reveal" style="animation-delay:1.4s" viewBox="0 0 280 34" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="葉と小花のガーランド">
      <path d="M8,18 C45,4 75,30 112,16 C149,2 179,30 216,16 C240,7 258,14 272,10"
            fill="none" stroke="var(--leaf)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <g fill="var(--leaf)" opacity="0.85">
        <path d="M40,10 C34,6 30,10 34,15 C38,12 40,10 40,10 Z"/>
        <path d="M108,24 C102,20 98,24 102,29 C106,26 108,24 108,24 Z"/>
        <path d="M182,22 C176,18 172,22 176,27 C180,24 182,22 182,22 Z"/>
        <path d="M248,8 C242,4 238,8 242,13 C246,10 248,8 248,8 Z"/>
      </g>
      <g fill="var(--petal)">
        <circle cx="72" cy="17" r="3"/>
        <circle cx="146" cy="6" r="3"/>
        <circle cx="216" cy="16" r="3"/>
      </g>
      <g fill="var(--gold)">
        <circle cx="72" cy="17" r="1.1"/>
        <circle cx="146" cy="6" r="1.1"/>
        <circle cx="216" cy="16" r="1.1"/>
      </g>
    </svg>

    <div class="illust-wrap">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>
    <svg class="illustration" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="向かい合う二羽の小鳥とハートのイラスト">
      <!-- soft filled bodies -->
      <path class="fill-shape" d="M18,78 C18,52 42,40 62,48 C70,51 74,44 80,38 C74,46 70,58 62,60 C46,64 26,66 18,78 Z" fill="var(--petal)" opacity="0.35"/>
      <path class="fill-shape" d="M182,78 C182,52 158,40 138,48 C130,51 126,44 120,38 C126,46 130,58 138,60 C154,64 174,66 182,78 Z" fill="var(--petal)" opacity="0.35"/>

      <g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="line-shape a" d="M18,78 C18,52 42,40 62,48 C70,51 74,44 80,38"/>
        <path class="line-shape a" d="M62,48 C58,58 46,60 36,55"/>
        <path class="line-shape a" d="M18,78 C24,86 40,90 52,82"/>
        <circle class="eye" cx="80" cy="38" r="1.6" fill="var(--accent)" stroke="none"/>

        <path class="line-shape b" d="M182,78 C182,52 158,40 138,48 C130,51 126,44 120,38"/>
        <path class="line-shape b" d="M138,48 C142,58 154,60 164,55"/>
        <path class="line-shape b" d="M182,78 C176,86 160,90 148,82"/>
        <circle class="eye" cx="120" cy="38" r="1.6" fill="var(--accent)" stroke="none"/>
      </g>
      <path class="heart-shape" d="M100,42 C96,34 85,36 85,46 C85,58 100,70 100,70 C100,70 115,58 115,46 C115,36 104,34 100,42 Z"
            fill="var(--gold)" stroke="none"/>
    </svg>
    </div>

    <h1 class="reveal" style="animation-delay:2.45s"><span class="nowrap">Happy</span> <span class="nowrap">Wedding</span></h1>
    <div class="divider reveal" style="animation-delay:2.6s"><span class="dot"></span></div>
    <p class="names reveal" id="names" style="animation-delay:2.52s"><span class="amp">&amp;</span></p>
    <p class="message reveal" style="animation-delay:2.72s">
      On this radiant day,<br>
      we wish you both<br>
      a lifetime of love and joy.
    </p>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="curtain" aria-hidden="true">
    <div class="curtain-panel left">
      <svg class="tie" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <path d="M28,28 C20,20 24,10 34,12 C42,14 44,24 36,30 C30,34 24,32 28,28 Z" fill="#f3cf9e" opacity="0.55"/>
        <path d="M28,28 C26,22 28,16 33,14" fill="none" stroke="rgba(169,125,52,0.35)" stroke-width="1.2"/>
        <path d="M28,28 C24,24 25,18 30,16" fill="none" stroke="rgba(169,125,52,0.3)" stroke-width="1"/>
        <path d="M28,28 C15,20 10,28 18,36" fill="none" stroke="#a07a4a" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M28,28 C20,16 28,8 36,16" fill="none" stroke="#a07a4a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="29" cy="25" r="4.6" fill="#e8836a"/>
        <circle cx="22" cy="29" r="3.5" fill="#f2ab8c"/>
        <circle cx="33" cy="32" r="3" fill="#c9a24a"/>
      </svg>
    </div>
    <div class="curtain-panel right">
      <svg class="tie" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <path d="M28,28 C36,20 32,10 22,12 C14,14 12,24 20,30 C26,34 32,32 28,28 Z" fill="#f3cf9e" opacity="0.55"/>
        <path d="M28,28 C30,22 28,16 23,14" fill="none" stroke="rgba(169,125,52,0.35)" stroke-width="1.2"/>
        <path d="M28,28 C32,24 31,18 26,16" fill="none" stroke="rgba(169,125,52,0.3)" stroke-width="1"/>
        <path d="M28,28 C41,20 46,28 38,36" fill="none" stroke="#a07a4a" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M28,28 C36,16 28,8 20,16" fill="none" stroke="#a07a4a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="27" cy="25" r="4.6" fill="#e8836a"/>
        <circle cx="34" cy="29" r="3.5" fill="#f2ab8c"/>
        <circle cx="23" cy="32" r="3" fill="#c9a24a"/>
      </svg>
    </div>
  </div>
</div>

<script>
(function () {
  // URLパラメータで新郎・新婦の名前を差し替え
  try {
    const params = new URLSearchParams(window.location.search);
    const groom = (params.get('groom') || '').trim();
    const bride  = (params.get('bride')  || '').trim();
    if (groom && bride) {
      const el = document.getElementById('names');
      // innerHTML を避け、DOM操作でXSSを防ぐ
      const ampSpan = document.createElement('span');
      ampSpan.className = 'amp';
      ampSpan.textContent = '&';
      el.textContent = '';
      el.append(document.createTextNode(groom), ampSpan, document.createTextNode(bride));
    }
  } catch (_) {}

  // フラワーシャワー演出:ドレープが開く瞬間に左右の下端から花びらと葉が舞う
  const confettiColors = ['#e8836a', '#f2ab8c', '#fff7ec', '#4f8f95', '#c9a24a'];
  const confettiContainer = document.getElementById('confetti');
  const confettiCount = window.innerWidth < 480 ? 34 : 46;
  for (let c = 0; c < confettiCount; c++) {
    const piece = document.createElement('span');
    const fromLeft = c % 2 === 0;
    piece.className = 'confetti-piece' + (Math.random() < 0.4 ? ' leaf' : '');
    piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    piece.style[fromLeft ? 'left' : 'right'] = (Math.random() * 4) + 'vw';

    const spreadX = 26 + Math.random() * 40;   // vw
    const riseY   = 55 + Math.random() * 30;   // vh 上昇量(上方向 = 負値)
    const dropY   = 15 + Math.random() * 25;   // vh 落下量(画面外へ落ちる = 正値)
    const dir = fromLeft ? 1 : -1;

    piece.style.setProperty('--mx',   (dir * spreadX * 0.8).toFixed(0) + 'vw');
    piece.style.setProperty('--my',   (-riseY).toFixed(0) + 'vh');          // 上昇
    piece.style.setProperty('--mrot', (dir * (180 + Math.random() * 180)).toFixed(0) + 'deg');
    piece.style.setProperty('--ex',   (dir * spreadX).toFixed(0) + 'vw');
    piece.style.setProperty('--ey',   dropY.toFixed(0) + 'vh');             // 落下(画面外へ)
    piece.style.setProperty('--erot', (dir * (360 + Math.random() * 360)).toFixed(0) + 'deg');
    piece.style.animationDelay = (0.85 + Math.random() * 0.3) + 's';
    confettiContainer.appendChild(piece);
  }

  // 落下する花びら
  const petalContainer = document.getElementById('petals');
  const petalColors = ['#e8836a', '#f2ab8c', '#4f8f95'];
  const petalShapes = [
    // 涙型(先が尖り、上が丸い基本形)
    '<path d="M8,20 C2,15 0,8 3,3 C5,0.5 8,0 8,0 C8,0 11,0.5 13,3 C16,8 14,15 8,20 Z" fill="__COLOR__"/>' +
    '<path d="M8,1.5 C8,7 8,13 8,18.5" stroke="rgba(107,61,36,0.15)" stroke-width="0.7" fill="none"/>',
    // 丸みの強い、バラの花びらのような形
    '<path d="M8,19 C3,16 0,11 1.5,6 C3,1.5 8,0.5 8,0.5 C8,0.5 13,1.5 14.5,6 C16,11 13,16 8,19 Z" fill="__COLOR__"/>' +
    '<path d="M8,2 C8,7.5 8,13 8,17.5" stroke="rgba(107,61,36,0.13)" stroke-width="0.8" fill="none"/>',
    // 細長い、ユリのような形
    '<path d="M8,20 C4,16 2,10 4,4 C5.5,1 8,0 8,0 C8,0 10.5,1 12,4 C14,10 12,16 8,20 Z" fill="__COLOR__"/>' +
    '<path d="M8,1 C8,7 8,13 8,19" stroke="rgba(107,61,36,0.14)" stroke-width="0.6" fill="none"/>',
    // 左右非対称の、風でよじれたような形
    '<path d="M8,19.5 C3,15 -0.5,9 2,4 C4,0.5 9,0 10.5,2 C13,5 15,11 12,15.5 C10.5,18 9,19 8,19.5 Z" fill="__COLOR__"/>' +
    '<path d="M7.5,2 C8,7.5 8.5,13 8,18" stroke="rgba(107,61,36,0.14)" stroke-width="0.7" fill="none"/>',
  ];
  const svgOpen  = '<svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">';
  const svgClose = '</svg>';
  const rand = (min, max) => Math.random() * (max - min) + min;
  const petalCount = window.innerWidth < 480 ? 18 : 24;
  const avgDuration = 11.5;
  const slot = avgDuration / petalCount;

  for (let i = 0; i < petalCount; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    const color = petalColors[Math.floor(Math.random() * petalColors.length)];
    const shape = petalShapes[Math.floor(Math.random() * petalShapes.length)];
    p.innerHTML = svgOpen + shape.replace('__COLOR__', color) + svgClose;

    const duration = 9 + Math.random() * 5;                   // 9〜14s
    const delay    = -(i * slot + Math.random() * slot);       // 均等割り+わずかなズレ
    const scale    = 0.6 + Math.random() * 0.7;               // 0.6〜1.3
    const spin     = Math.random() < 0.5 ? 1 : -1;

    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--scale', scale.toFixed(2));
    p.style.animationDuration = duration + 's';
    p.style.animationDelay    = delay + 's';

    p.style.setProperty('--startZ', rand(0, 360).toFixed(0) + 'deg');
    p.style.setProperty('--startY', rand(0, 360).toFixed(0) + 'deg');
    p.style.setProperty('--mx',     rand(-50, 50).toFixed(0) + 'px');
    p.style.setProperty('--ex',     rand(-70, 70).toFixed(0) + 'px');
    p.style.setProperty('--my',     (rand(140, 240) * spin).toFixed(0) + 'deg');
    p.style.setProperty('--ey',     (rand(320, 460) * spin).toFixed(0) + 'deg');
    p.style.setProperty('--peak',   rand(0.6, 0.9).toFixed(2));
    p.style.setProperty('--fade',   rand(0.3, 0.5).toFixed(2));

    petalContainer.appendChild(p);
  }

  // イラスト周りにきらめきを散らす
  const sparkleBox = document.getElementById('sparkles');
  if (sparkleBox) {
    const sparkleSpots = [
      { top: '6%',  left: '12%' }, { top: '14%', left: '86%' },
      { top: '70%', left: '4%'  }, { top: '82%', left: '90%' },
      { top: '2%',  left: '55%' }, { top: '90%', left: '50%' },
    ];
    for (const spot of sparkleSpots) {
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.textContent = '✦';
      sp.style.top  = spot.top;
      sp.style.left = spot.left;
      sp.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      sp.style.animationDelay    = (Math.random() * 3) + 's';
      sparkleBox.appendChild(sp);
    }
  }
})();
</script>
</body>
</html>
