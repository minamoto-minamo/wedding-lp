<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720" preserveAspectRatio="xMaxYMid slice">
  <defs>

    <!-- ===== 布のベースカラー (外→内) ===== -->
    <linearGradient id="fabL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e8c4a0"/>
      <stop offset="18%"  stop-color="#dba060"/>
      <stop offset="48%"  stop-color="#c47830"/>
      <stop offset="75%"  stop-color="#a85c18"/>
      <stop offset="100%" stop-color="#8a4410"/>
    </linearGradient>

    <!-- ===== なめらかなプリーツ模様 (50px周期) ===== -->
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="18%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="38%"  stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="72%"  stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="88%"  stop-color="#ffffff" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="pleat" x="0" y="0" width="50" height="720" patternUnits="userSpaceOnUse">
      <rect width="50" height="720" fill="url(#pg)"/>
    </pattern>

    <!-- ===== 上からの光 ===== -->
    <linearGradient id="topLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="12%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="28%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ===== 内端の暗い影 (パネル内側の端) ===== -->
    <linearGradient id="shadL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="72%"  stop-color="rgba(30,10,0,0)"/>
      <stop offset="90%"  stop-color="rgba(30,10,0,0.38)"/>
      <stop offset="100%" stop-color="rgba(30,10,0,0.65)"/>
    </linearGradient>

    <!-- ===== 縁のゴールドトリム ===== -->
    <linearGradient id="trim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0e060"/>
      <stop offset="25%"  stop-color="#faf2a0"/>
      <stop offset="52%"  stop-color="#c09830"/>
      <stop offset="78%"  stop-color="#8c6818"/>
      <stop offset="100%" stop-color="#c09830"/>
    </linearGradient>

    <!-- ===== タイバック (サッシュ布) のグラデーション ===== -->
    <linearGradient id="sashG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0d080"/>
      <stop offset="30%"  stop-color="#d49030"/>
      <stop offset="65%"  stop-color="#b87020"/>
      <stop offset="100%" stop-color="#c88830"/>
    </linearGradient>
    <linearGradient id="sashShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ===== タイバックの影 ===== -->
    <filter id="sashShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(60,24,0,0.50)"/>
    </filter>

    <!-- ===== パネルのシルエット ===== -->
    <!-- スカラップ (均等な半円): 上部, タイバック, スウィング -->
    <clipPath id="cL">
      <path d="
        M 0,30
        Q 20,2  40,30  Q 60,2  80,30
        Q 100,2 120,30 Q 140,2 160,30
        Q 180,2 200,30 Q 220,2 240,30
        Q 260,2 280,30 Q 300,2 320,28
        Q 340,2 365,20
        L 393,10
        L 393,370
        C 384,390 368,416 346,436
        C 326,454 306,462 294,464
        C 308,472 334,488 360,508
        C 378,522 393,538 393,552
        L 393,720
        L 0,720
        Z
      "/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════
       カーテンパネル
  ══════════════════════════════ -->
  <g clip-path="url(#cL)">
    <!-- 布ベース -->
    <rect x="0" y="0" width="400" height="720" fill="url(#fabL)"/>
    <!-- なめらかなプリーツ -->
    <rect x="0" y="0" width="400" height="720" fill="url(#pleat)"/>
    <!-- 上からの光 -->
    <rect x="0" y="0" width="400" height="720" fill="url(#topLight)"/>
    <!-- 内端の影 -->
    <rect x="0" y="0" width="400" height="720" fill="url(#shadL)"/>
  </g>
  <!-- 内端のゴールドトリム -->
  <g clip-path="url(#cL)">
    <rect x="387" y="0" width="7" height="720" fill="url(#trim)"/>
    <rect x="387" y="0" width="2" height="720" fill="rgba(255,255,255,0.28)"/>
  </g>

  <!-- ══════════════════════════════
       タイバック (シンプルなサッシュ結び)
       タイバック最深部: x≈294, y≈464
  ══════════════════════════════ -->
  <g filter="url(#sashShadow)">
    <!-- 横帯 (布が引き絞られた部分) -->
    <path d="
      M 180,450
      C 210,444 250,442 294,464
      C 338,486 370,488 390,484
      L 390,504
      C 370,508 336,506 292,484
      C 248,462 208,464 178,470
      Z
    " fill="url(#sashG)"/>
    <!-- 光沢オーバーレイ -->
    <path d="
      M 180,450
      C 210,444 250,442 294,464
      C 338,486 370,488 390,484
      L 390,492
      C 370,494 338,492 294,470
      C 250,448 210,448 180,454
      Z
    " fill="url(#sashShine)"/>

    <!-- 結び目 (中央の丸みのある塊) -->
    <ellipse cx="294" cy="474" rx="20" ry="14"
             fill="#d49030" stroke="#9a6818" stroke-width="1.8"/>
    <ellipse cx="290" cy="469" rx="10" ry="6"
             fill="rgba(255,255,255,0.40)"/>

    <!-- テール (下に垂れる布) -->
    <path d="M 280,484 Q 272,520 266,560 Q 262,590 260,620"
          fill="none" stroke="#c08020" stroke-width="14" stroke-linecap="round"/>
    <path d="M 308,484 Q 316,520 320,558 Q 324,588 326,618"
          fill="none" stroke="#c08020" stroke-width="14" stroke-linecap="round"/>
    <!-- テールの光沢 -->
    <path d="M 278,488 Q 270,524 264,564"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 310,488 Q 318,522 322,562"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round"/>
  </g>

</svg>
